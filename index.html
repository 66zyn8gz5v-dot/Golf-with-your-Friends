<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantasy Golf">
  <meta name="theme-color" content="#1b2a4a">
  <!-- Sicherheitsregeln für den Browser: was diese Seite laden und wohin sie sprechen darf.
       Alles ist verboten, außer dem, was hier ausdrücklich steht (default-src 'none').

       script-src 'self'       Programmcode nur aus diesem Verzeichnis – keine fremden Skripte,
                               keine Inline-Skripte. Deshalb steht aller Code in src/*.js.
       style-src 'unsafe-inline' ist nötig, weil Spielerfarben und Positionen als style-Attribut
                               am Element hängen (z. B. die Farbpunkte der Spieler). Inline-Stile
                               können keinen Code ausführen; das Risiko ist gering.
       connect-src             nur der MQTT-Vermittler für Netzspiel und Rangliste – und
                               localhost fürs Testen. Wer einen anderen Vermittler einträgt
                               (localStorage fantasygolf.broker), muss diese Zeile mit anpassen.
       object-src 'none', base-uri 'none', form-action 'none': verbietet eingebettete Objekte,
                               ein umgebogenes <base> und das Absenden von Formularen.

       Nicht möglich: frame-ancestors (wer die Seite in einen Rahmen stellen darf) wirkt nur als
       HTTP-Kopfzeile, nicht im Meta-Tag – GitHub Pages lässt keine eigenen Kopfzeilen zu. Das
       Spiel kann also von fremden Seiten eingebettet werden. Da es keine Anmeldung und keine
       Sitzung gibt, bringt das einem Angreifer nichts; nötig wäre dafür ein eigener Server. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self';
    connect-src 'self' wss://broker.emqx.io:8084 ws://localhost:9001;
    manifest-src 'self';
    worker-src 'self';
    base-uri 'none';
    object-src 'none';
    form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fantasy Golf – Golf with your Friends</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="vorschau-band" hidden>Vorschau – hier wird geprüft, was noch nicht im Spiel ist</div>

  <div id="hud">
    <div class="hud-box" id="hud-left">
      <div id="hud-hole">Bahn 1 / 8</div>
      <div id="hud-name">–</div>
      <div id="hud-best"></div>
    </div>
    <div class="hud-box" id="hud-right">
      <div id="hud-player">–</div>
      <div id="hud-strokes">Schläge: 0 · Par 3</div>
      <div id="hud-time"></div>
    </div>
  </div>

  <div id="power"><div id="power-fill"></div></div>
  <div id="scoreboard"></div>
  <div id="message"></div>
  <div id="controls">
    <button class="cbtn leave" id="leave-btn" title="Zurück zur Weltkarte (Esc)"><i data-icon="arrow_back"></i> <span class="lang">Weltkarte</span><span class="kurz">Karte</span></button>
    <button class="cbtn" id="cam-overview" title="Ganze Bahn zeigen (M)"><i data-icon="map"></i><span class="lang"> Übersicht</span></button>
    <button class="cbtn" id="cam-left" title="Kamera nach links drehen (Q)"><i data-icon="rotate_left"></i></button>
    <button class="cbtn" id="cam-right" title="Kamera nach rechts drehen (E)"><i data-icon="rotate_right"></i></button>
    <button class="cbtn" id="cam-out" title="Herauszoomen (−)"><i data-icon="zoom_out"></i></button>
    <button class="cbtn" id="cam-in" title="Hineinzoomen (+)"><i data-icon="zoom_in"></i></button>
    <button class="cbtn" id="music-btn" title="Musik an/aus (J)"><i data-icon="music_note"></i></button>
    <button class="cbtn creative" id="cr-prev" title="Vorherige Bahn (P)"><i data-icon="skip_previous"></i> Bahn</button>
    <button class="cbtn creative" id="cr-next" title="Nächste Bahn (N)">Bahn <i data-icon="skip_next"></i></button>
    <button class="cbtn creative" id="cr-reset" title="Ball an den Abschlag (R)"><i data-icon="restart_alt"></i> Ball zurück</button>
    <button class="cbtn testing" id="cr-editor" title="Zurück in den Baumodus"><i data-icon="construction"></i> Editor</button>
  </div>
  <div id="hint">Vom Ball wegziehen &amp; loslassen</div>
  <button class="cbtn" id="fs-btn" title="Vollbild an/aus (F)"><i data-icon="fullscreen"></i> Vollbild</button>

  <div id="overlay" class="screen"></div>

  <script src="src/version.js"></script>
  <script src="src/text.js"></script>
  <script src="src/themes.js"></script>
  <script src="src/courses.js"></script>
  <script src="src/courses_sea.js"></script>
  <script src="src/courses_jungle.js"></script>
  <script src="src/courses_storm.js"></script>
  <script src="src/courses_shadow.js"></script>
  <script src="src/courses_colosseum.js"></script>
  <script src="src/courses_pro.js"></script>
  <script src="src/level.js"></script>
  <script src="src/obstacles.js"></script>
  <script src="src/obstacles_legend.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/render.js"></script>
  <script src="src/render_legend.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/hats.js"></script>
  <script src="src/net.js"></script>
  <script src="src/best.js"></script>
  <script src="src/share.js"></script>
  <script src="src/sfx.js"></script>
  <script src="src/music.js"></script>
  <script src="src/worldmap.js"></script>
  <script src="src/title.js"></script>
  <script src="src/editor.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
