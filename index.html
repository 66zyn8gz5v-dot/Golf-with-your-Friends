  <!-- Sicherheitsregeln für den Browser: was diese Seite laden und wohin sie sprechen darf.
       Alles ist verboten, außer dem, was hier ausdrücklich steht (default-src 'none').

       script-src 'self'       Programmcode nur aus diesem Verzeichnis – keine fremden Skripte,
                               keine Inline-Skripte. Deshalb steht aller Code in src/*.js.
       style-src 'unsafe-inline' ist nötig, weil Spielerfarben und Positionen als style-Attribut
                               am Element hängen (z. B. die Farbpunkte der Spieler). Inline-Stile
                               können keinen Code ausführen; das Risiko ist gering.
       connect-src             nur der MQTT-Vermittler für Netzspiel und Rangliste – und
                               localhost fürs Testen. Wer einen anderen Vermittler einträgt
                               (localStorage fantasygolf.broker), muss diese Zeile mit anpassen.
       object-src 'none', base-uri 'none', form-action 'none': verbietet eingebettete Objekte,
                               ein umgebogenes <base> und das Absenden von Formularen.

       Nicht möglich: frame-ancestors (wer die Seite in einen Rahmen stellen darf) wirkt nur als
       HTTP-Kopfzeile, nicht im Meta-Tag – GitHub Pages lässt keine eigenen Kopfzeilen zu. Das
       Spiel kann also von fremden Seiten eingebettet werden. Da es keine Anmeldung und keine
       Sitzung gibt, bringt das einem Angreifer nichts; nötig wäre dafür ein eigener Server. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self';
    connect-src 'self' wss://broker.emqx.io:8084 ws://localhost:9001;
    manifest-src 'self';
    worker-src 'self';
    base-uri 'none';
    object-src 'none';
    form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fantasy Golf – Golf with your Friends</title>
  <!-- Die Zierschrift kommt NICHT als <link> hierher, sondern wird in main.js nachgeladen.
       Ein Stylesheet im Kopf hält das erste Bild auf, bis es da ist – und es liegt bei Google, nicht
       bei uns. Gemessen mit einer Antwort, die fünf Sekunden auf sich warten lässt: erstes Bild
       nach 5039 ms mit dem <link> hier, nach 97 ms ohne ihn. Solange nichts gezeichnet wird, läuft
       auch requestAnimationFrame nicht – das Ladebild käme also genau dann nicht, wenn man es
       braucht. Nachgeladen stört die Schrift niemanden: Bis sie da ist, steht die Überschrift in
       Georgia, danach wechselt sie. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

       sehen, bevor die erste Zeile JavaScript gelaufen ist – und auch dann noch, wenn eine Datei
       hängt. Weggenommen wird es aus main.js, sobald der Startbildschirm wirklich steht. -->
  <div id="lade" role="status" aria-label="Fantasy Golf wird geladen">

        </defs>
        <rect width="240" height="92" fill="url(#lbHimmel)"/>
        <!-- Wolken, wie sie im Titelbild über dem Meer stehen -->

          <ellipse class="lb-wolke w2" cx="150" cy="12" rx="24" ry="5.5"/><ellipse class="lb-wolke w2" cx="140" cy="9" rx="13" ry="4.5"/>

          <g fill="#cbc3b4">
            <rect x="122" y="30" width="6" height="14"/><rect x="131" y="25" width="8" height="19"/><rect x="142" y="32" width="6" height="12"/>
            <path d="M122 30 L125 23 L128 30 Z" fill="#a23a34"/><path d="M131 25 L135 16 L139 25 Z" fill="#a23a34"/><path d="M142 32 L145 25 L148 32 Z" fill="#a23a34"/>

  <!-- Startbild. Das gemalte Bild liegt als <image> in einem SVG, und alles, was sich bewegt,
       liegt im selben Koordinatensystem darüber (1170x639, die Maße des Bildes). Darum sitzt jede
       Bewegung immer genau an ihrer Stelle, egal wie der Schirm geschnitten ist: Bild und Auflagen
       werden gemeinsam beschnitten.

       Der Kniff bei der Fahne: Sie wird nicht nachgezeichnet – das ginge nie genau genug. Statt
       dessen liegt dasselbe Bild ein zweites Mal darüber, auf die Fahne beschnitten und durch ein
       Wellenfeld geschickt (feTurbulence + feDisplacementMap). Verschoben werden also die gemalten
       Pixel selbst, mitsamt Löwe und Zaddeln; darunter steht das Original und füllt die Ränder. -->
  <div id="titelbild" aria-hidden="true">
    <svg id="tb-svg" viewBox="0 0 1170 639" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="tbWeh" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013 0.036" numOctaves="2" seed="7" result="wind">
            <animate attributeName="baseFrequency" dur="6s" repeatCount="indefinite"
              values="0.013 0.036;0.021 0.052;0.011 0.030;0.018 0.044;0.013 0.036"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="wind" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <clipPath id="tbFahne">
          <path d="M90 103 L139 119 L167 136 L183 153 L198 177 L220 208 L204 212 L211 228 L192 268
                   L150 227 L120 231 L105 223 L75 215 L81 160 Z"/>
        </clipPath>
        <radialGradient id="tbSchein">
          <stop offset="0" stop-color="#ffd88a" stop-opacity="0.55"/>
          <stop offset="0.45" stop-color="#ffbe5a" stop-opacity="0.22"/>
          <stop offset="1" stop-color="#ffbe5a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g class="tb-kamera">
        <image href="icons/titelbild.jpg" x="0" y="0" width="1170" height="639" preserveAspectRatio="none"/>

        <!-- Die wehende Fahne -->
        <g filter="url(#tbWeh)">
          <g clip-path="url(#tbFahne)">
            <image href="icons/titelbild.jpg" x="0" y="0" width="1170" height="639" preserveAspectRatio="none"/>
          </g>
        </g>

        <!-- Wolken ziehen über den Himmel -->
        <g fill="#ffffff">
          <g class="tb-zug"><ellipse cx="180" cy="52" rx="130" ry="26" opacity="0.11"/><ellipse cx="270" cy="40" rx="74" ry="17" opacity="0.09"/></g>
          <g class="tb-zug z2"><ellipse cx="560" cy="34" rx="155" ry="23" opacity="0.09"/></g>
          <g class="tb-zug z3"><ellipse cx="880" cy="96" rx="105" ry="19" opacity="0.08"/><ellipse cx="960" cy="88" rx="60" ry="14" opacity="0.07"/></g>
        </g>

        <!-- Möwen -->
        <g class="tb-voegel" fill="none" stroke="#f2f7ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
          <path class="tb-vogel" d="M0 0 q5 -4 10 0 q5 -4 10 0"/>
          <path class="tb-vogel v2" d="M0 0 q4 -3 8 0 q4 -3 8 0"/>
          <path class="tb-vogel v3" d="M0 0 q4.5 -3.5 9 0 q4.5 -3.5 9 0"/>
        </g>

        <!-- Sonnenfunkeln auf dem Wasser -->
        <g class="tb-funken" fill="#ffffff">
          <ellipse cx="232" cy="410" rx="9" ry="1.6"/><ellipse cx="404" cy="455" rx="7" ry="1.4" class="f2"/>
          <ellipse cx="586" cy="528" rx="11" ry="1.8" class="f3"/><ellipse cx="731" cy="296" rx="8" ry="1.5" class="f4"/>
          <ellipse cx="884" cy="600" rx="10" ry="1.7" class="f2"/><ellipse cx="1046" cy="360" rx="7" ry="1.4" class="f5"/>
          <ellipse cx="330" cy="300" rx="6" ry="1.3" class="f4"/><ellipse cx="1122" cy="512" rx="9" ry="1.6" class="f3"/>
        </g>

        <!-- Die Laterne am Zaun brennt -->
        <circle class="tb-lampe" cx="159" cy="438" r="40" fill="url(#tbSchein)"/>

        <!-- Lichtpunkte über der Wiese -->
        <g class="tb-staub" fill="#fff3c4">
          <circle cx="250" cy="600" r="2.2"/><circle cx="430" cy="585" r="1.8" class="s2"/>
          <circle cx="600" cy="612" r="2" class="s3"/><circle cx="120" cy="575" r="1.6" class="s4"/>
          <circle cx="760" cy="620" r="1.9" class="s5"/>
        </g>
      </g>
    </svg>

    <!-- Dasselbe noch einmal fürs Hochformat. Ein eigenes Bild statt eines Ausschnitts: Beschnitten
         wäre vom Querbild auf dem Handy nur ein schmaler Streifen übrig, und der Schriftzug läge
         zerschnitten darin. Die Maße sind andere (1170 x 2078), also braucht es auch eigene Stellen
         für Fahne, Laterne und Funkeln – und einen eigenen Filter, denn ein Filter gilt nur
         innerhalb seines eigenen SVG. -->
    <svg id="tb-hoch" viewBox="0 0 1170 2078" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="thWeh" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.021" numOctaves="2" seed="7" result="wind">
            <animate attributeName="baseFrequency" dur="6s" repeatCount="indefinite"
              values="0.008 0.021;0.013 0.030;0.007 0.018;0.011 0.026;0.008 0.021"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="wind" scale="20" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <clipPath id="thFahne">
          <path d="M74 1270 L160 1305 L250 1337 L330 1378 L362 1402
                   L326 1424 L350 1452 L318 1476 L344 1516 L300 1536 L342 1602
                   L252 1548 L170 1516 L104 1497 L72 1488 L66 1380 Z"/>
        </clipPath>
        <radialGradient id="thSchein">
          <stop offset="0" stop-color="#ffd88a" stop-opacity="0.55"/>
          <stop offset="0.45" stop-color="#ffbe5a" stop-opacity="0.22"/>
          <stop offset="1" stop-color="#ffbe5a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g class="tb-kamera">
        <image href="icons/titelbild-hoch.jpg" x="0" y="0" width="1170" height="2078" preserveAspectRatio="none"/>

        <g filter="url(#thWeh)">
          <g clip-path="url(#thFahne)">
            <image href="icons/titelbild-hoch.jpg" x="0" y="0" width="1170" height="2078" preserveAspectRatio="none"/>
          </g>
        </g>

        <g fill="#ffffff">
          <g class="tb-zug"><ellipse cx="200" cy="90" rx="150" ry="30" opacity="0.11"/><ellipse cx="300" cy="72" rx="86" ry="20" opacity="0.09"/></g>
          <g class="tb-zug z2"><ellipse cx="700" cy="60" rx="170" ry="26" opacity="0.09"/></g>
          <g class="tb-zug z3"><ellipse cx="480" cy="215" rx="120" ry="22" opacity="0.08"/></g>
        </g>

        <g class="tb-voegel" fill="none" stroke="#f2f7ff" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
          <path class="tb-vogel" d="M0 0 q7 -5 14 0 q7 -5 14 0"/>
          <path class="tb-vogel v2" d="M0 0 q5 -4 10 0 q5 -4 10 0"/>
        </g>

        <g class="tb-funken" fill="#ffffff">
          <ellipse cx="190" cy="912" rx="13" ry="2.2"/><ellipse cx="506" cy="1608" rx="11" ry="2" class="f2"/>
          <ellipse cx="1013" cy="1545" rx="14" ry="2.3" class="f3"/><ellipse cx="152" cy="558" rx="10" ry="1.8" class="f4"/>
          <ellipse cx="660" cy="1180" rx="12" ry="2.1" class="f2"/><ellipse cx="1089" cy="700" rx="11" ry="2" class="f5"/>
          <ellipse cx="430" cy="1440" rx="9" ry="1.7" class="f4"/><ellipse cx="860" cy="1300" rx="12" ry="2.1" class="f3"/>
        </g>

        <circle class="tb-lampe hoch" cx="251" cy="1734" r="58" fill="url(#thSchein)"/>

        <g class="tb-staub" fill="#fff3c4">
          <circle cx="420" cy="2000" r="3.2"/><circle cx="700" cy="1970" r="2.6" class="s2"/>
          <circle cx="900" cy="2020" r="2.9" class="s3"/><circle cx="230" cy="1960" r="2.4" class="s4"/>
          <circle cx="1050" cy="2030" r="2.7" class="s5"/>
        </g>
      </g>
    </svg>
  </div>

  <canvas id="game"></canvas>

  <div id="vorschau-band" hidden>Vorschau – hier wird geprüft, was noch nicht im Spiel ist</div>
