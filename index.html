<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantasy Golf">
  <meta name="theme-color" content="#1b2a4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fantasy Golf – Golf with your Friends</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box" id="hud-left">
      <div id="hud-hole">Bahn 1 / 8</div>
      <div id="hud-name">–</div>
    </div>
    <div class="hud-box" id="hud-right">
      <div id="hud-player">–</div>
      <div id="hud-strokes">Schläge: 0 · Par 3</div>
    </div>
  </div>

  <div id="power"><div id="power-fill"></div></div>
  <div id="scoreboard"></div>
  <div id="message"></div>
  <div id="controls">
    <button class="cbtn" id="cam-overview" title="Übersicht (M)">Karte</button>
    <button class="cbtn" id="cam-left" title="Kamera nach links drehen (Q)">⟲</button>
    <button class="cbtn" id="cam-right" title="Kamera nach rechts drehen (E)">⟳</button>
    <button class="cbtn" id="cam-out" title="Herauszoomen (−)">−</button>
    <button class="cbtn" id="cam-in" title="Hineinzoomen (+)">+</button>
    <button class="cbtn creative" id="cr-prev" title="Vorherige Bahn (P)">◀ Bahn</button>
    <button class="cbtn creative" id="cr-next" title="Nächste Bahn (N)">Bahn ▶</button>
    <button class="cbtn creative" id="cr-reset" title="Ball an den Abschlag (R)">Ball zurück</button>
    <button class="cbtn testing" id="cr-editor" title="Zurück in den Baumodus">🛠 Editor</button>
  </div>
  <div id="hint">Vom Ball wegziehen &amp; loslassen</div>
  <button class="cbtn" id="fs-btn" title="Vollbild an/aus (F)">⛶ Vollbild</button>

  <div id="overlay" class="screen"></div>

  <script src="src/themes.js"></script>
  <script src="src/courses.js"></script>
  <script src="src/courses_sea.js"></script>
  <script src="src/courses_pro.js"></script>
  <script src="src/level.js"></script>
  <script src="src/obstacles.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/render.js"></script>
  <script src="src/sfx.js"></script>
  <script src="src/title.js"></script>
  <script src="src/editor.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
