# Veröffentlicht zwei Stände nebeneinander auf GitHub Pages:
#
#   …/Golf-with-your-Friends/           das Spiel  (Zweig main)
#   …/Golf-with-your-Friends/vorschau/  die Vorschau (Arbeitszweig)
#
# Gebaut wird immer beides zusammen, damit das Ergebnis zueinander passt. Neues geht zuerst in
# die Vorschau; ins Spiel kommt es erst, wenn der Arbeitszweig nach main übernommen wird.
#
# Warum der Lauf nur an main hängt: Die Umgebung „github-pages" nimmt Veröffentlichungen nur von
# main an – Läufe von anderen Zweigen scheitern an der Schutzregel. Nach einem Push in die
# Vorschau wird der Lauf darum von Hand angestoßen (workflow_dispatch); er holt sich den neuen
# Stand der Vorschau selbst aus dem Arbeitszweig.
name: Fantasy Golf auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VORSCHAU_ZWEIG: claude/fantasy-golf-game-8-holes-t25aag

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Das Spiel holen (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: spiel

      - name: Die Vorschau holen (Arbeitszweig)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VORSCHAU_ZWEIG }}
          path: vorschau

      - uses: actions/configure-pages@v5

      - name: Beide Stände einsammeln
        run: |
          set -e
          dateien() {   # $1 = Quelle, $2 = Ziel
            mkdir -p "$2"
            cp -r "$1"/index.html "$1"/style.css "$1"/manifest.webmanifest "$1"/sw.js "$1"/src "$1"/icons "$2"/
          }
          mkdir -p _site
          dateien spiel _site
          dateien vorschau _site/vorschau
          echo "Spiel:    $(grep -o 'APP_VERSION = [0-9]*' _site/src/version.js)"
          echo "Vorschau: $(grep -o 'APP_VERSION = [0-9]*' _site/vorschau/src/version.js)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
