# Veröffentlicht das Spiel bei jedem Push automatisch auf GitHub Pages.
# Voraussetzung: Repository-Einstellungen → Pages → Source: "GitHub Actions".
name: Fantasy Golf auf GitHub Pages

on:
  push:
    branches: [main, claude/fantasy-golf-game-8-holes-t25aag]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Spieldateien einsammeln
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest sw.js src icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
